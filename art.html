<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ваши рисунки — Питомник RED APPLE</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ===== только для этой страницы ===== */

  /* заголовок */
  .hero {
    max-width: 720px;
    margin: 44px auto 50px;
    padding: 22px 20px;
    border: 4px solid var(--ink);
    border-radius: 4px;
    background: #fff;
    text-align: center;
  }
  .hero h1 {
    font-family: "Segoe Script", "Comic Sans MS", cursive;
    font-size: clamp(34px, 7vw, 64px);
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .lead {
    max-width: 720px;
    margin: 0 auto 40px;
    text-align: center;
    font-size: 18px;
    line-height: 1.5;
  }

  /* сетка рисунков */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 34px 28px;
  }

  .art { display: flex; flex-direction: column; gap: 10px; }

  .frame {
    aspect-ratio: 1;
    border: 4px solid var(--pink);
    border-radius: 8px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    font-size: 15px;
    overflow: hidden;
  }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    cursor: zoom-in;
  }

  .art .title { font-weight: 700; font-size: 18px; }
  .art .author { color: var(--red); font-size: 15px; }

  /* просмотр по клику */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
    cursor: zoom-out;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
</style>
</head>
<body>

<nav class="topbar">
  <a href="index.html">Главная</a>
  <a href="about.html">О нас</a>
  <a href="map.html">Карта</a>
  <a href="admins.html">Админ-состав</a>
  <a href="rules.html">Правила</a>
  <a href="residents.html">Постояльцы</a>
  <a href="art.html" class="current">Ваши рисунки</a>
</nav>

<div class="wrap">

  <header class="hero">
    <h1>Ваши рисунки</h1>
  </header>

  <p class="lead">Работы наших гостей и персонала. Хочешь, чтобы твой рисунок появился здесь? Отправь его админам.</p>

  <!--
    КАК ДОБАВИТЬ РИСУНОК:
    1. Положи картинку в папку art (например art/kio.png).
    2. Скопируй один из блоков <figure class="art"> ниже и вставь в конец галереи.
    3. Замени строку <div class="frame">...</div> на:
         <div class="frame"><img src="art/kio.png" alt="Название"></div>
    4. Поменяй название и автора.
    Совет: картинки лучше до 1 МБ, чтобы сайт грузился быстро.
  -->

  <main class="gallery">

    <figure class="art">
      <div class="frame">Рисунок (вставим позже)</div>
      <figcaption>
        <div class="title">Название работы</div>
        <div class="author">Автор: ник</div>
      </figcaption>
    </figure>

    <figure class="art">
      <div class="frame">Рисунок (вставим позже)</div>
      <figcaption>
        <div class="title">Название работы</div>
        <div class="author">Автор: ник</div>
      </figcaption>
    </figure>

    <figure class="art">
      <div class="frame">Рисунок (вставим позже)</div>
      <figcaption>
        <div class="title">Название работы</div>
        <div class="author">Автор: ник</div>
      </figcaption>
    </figure>

  </main>

  <footer>Питомник RED APPLE</footer>
</div>

<!-- окно просмотра -->
<div class="lightbox" id="lightbox"><img alt=""></div>

<script>
  // Клик по рисунку открывает его крупно, клик по тёмному фону закрывает
  const box = document.getElementById('lightbox');
  const big = box.querySelector('img');
  document.querySelectorAll('.frame img').forEach(img => {
    img.addEventListener('click', () => {
      big.src = img.src;
      box.classList.add('show');
    });
  });
  box.addEventListener('click', () => box.classList.remove('show'));
</script>

</body>
</html>
