<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта — Питомник RED APPLE</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ===== только для этой страницы ===== */

  /* заголовок */
  .hero {
    max-width: 640px;
    margin: 44px auto 36px;
    padding: 18px 20px;
    border: 4px solid var(--ink);
    border-radius: 4px;
    background: #fff;
    text-align: center;
  }
  .hero h1 {
    font-family: "Segoe Script", "Comic Sans MS", cursive;
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 400;
    text-transform: lowercase;
  }

  /* рамка с картой */
  .map-frame {
    border: 4px solid var(--ink);
    border-radius: 4px;
    background: #fff;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .map-frame img {
    display: block;
    width: 100%;
    max-width: 1081px;
    height: auto;
    cursor: zoom-in;
  }

  .hint {
    text-align: center;
    margin-top: 14px;
    font-size: 15px;
    opacity: .7;
  }

  /* просмотр по клику */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.88);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
    cursor: zoom-out;
    overflow: auto;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: none;
    width: min(1400px, 100%);
    height: auto;
    border-radius: 4px;
    background: #fff;
  }

  @media (max-width: 480px) {
    .map-frame { padding: 10px; }
  }
</style>
</head>
<body>

<nav class="topbar">
  <a href="index.html">Главная</a>
  <a href="about.html">О нас</a>
  <a href="map.html" class="current">Карта</a>
  <a href="admins.html">Админ-состав</a>
  <a href="rules.html">Правила</a>
  <a href="residents.html">Постояльцы</a>
  <a href="art.html">Ваши рисунки</a>
</nav>

<div class="wrap">

  <header class="hero">
    <h1>карта</h1>
  </header>

  <main>
    <div class="map-frame">
      <img id="map" src="map.png" alt="Карта питомника RED APPLE">
    </div>
    <p class="hint">Нажми на карту, чтобы рассмотреть её крупнее</p>
  </main>

  <footer>Питомник RED APPLE</footer>
</div>

<!-- окно просмотра -->
<div class="lightbox" id="lightbox"><img src="map.png" alt="Карта питомника RED APPLE"></div>

<script>
  // Клик по карте открывает её крупно, клик по тёмному фону закрывает
  const box = document.getElementById('lightbox');
  document.getElementById('map').addEventListener('click', () => box.classList.add('show'));
  box.addEventListener('click', () => box.classList.remove('show'));
</script>

</body>
</html>
